# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - bandit@1.9.2
    - black@25.12.0
    - checkov@3.2.495
    - dotenv-linter@4.0.0
    - git-diff-check
    - isort@7.0.0
    - markdownlint@0.45.0
    - osv-scanner@2.3.0
    - oxipng@10.0.0
    - prettier@3.6.2
    - ruff@0.14.8
    - snyk@1.1295.0
    - svgo@4.0.0
    - trufflehog@3.91.2
  ignore:
    - linters: [ALL]
      paths:
        # Email templates require inline styles (email clients don't support external CSS)
        - templates/emails/**
        # Development/seed scripts use random generators intentionally
        - add_reviews.py
        - populate_db.py
        - test_flow.py
        # Static files from third-party libraries
        - staticfiles/**
    - linters: [bandit]
      paths:
        # Test files use intentional test passwords
        - store/tests/**
