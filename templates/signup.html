{% extends 'base.html' %}

{% block title %}Sign Up | Agri B2B{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-4">Create Account</h3>
                    <form method="post" action=".">
                        {% csrf_token %}
                        
                        <!-- Simple UserCreationForm expects username, password 1 & 2. 
                             If using custom form, adjust fields. Assuming standard UserCreationForm for now. -->
                        {{ form.as_p }}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Sign Up</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="small text-muted">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none text-primary">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
