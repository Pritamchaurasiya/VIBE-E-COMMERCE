{% comment %}
Social Share Buttons Component
Include this in product detail or any page that needs share buttons.
Usage: {% include 'partials/social_share.html' with share_url=product_url title=product.name %}
{% endcomment %}

<div class="social-share-container" data-share-url="{{ share_url|default:request.build_absolute_uri }}" data-share-title="{{ title|default:'Check this out!' }}">
    <span class="share-label">Share:</span>

    <div class="share-buttons">
        <!-- Facebook -->
        <a href="#" class="share-btn share-facebook" onclick="shareToFacebook(event)" title="Share on Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
            </svg>
        </a>

        <!-- Twitter/X -->
        <a href="#" class="share-btn share-twitter" onclick="shareToTwitter(event)" title="Share on X/Twitter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
            </svg>
        </a>

        <!-- WhatsApp -->
        <a href="#" class="share-btn share-whatsapp" onclick="shareToWhatsApp(event)" title="Share on WhatsApp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path>
            </svg>
        </a>

        <!-- LinkedIn -->
        <a href="#" class="share-btn share-linkedin" onclick="shareToLinkedIn(event)" title="Share on LinkedIn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect x="2" y="9" width="4" height="12"></rect>
                <circle cx="4" cy="4" r="2"></circle>
            </svg>
        </a>

        <!-- Copy Link -->
        <a href="#" class="share-btn share-copy" onclick="copyShareLink(event)" title="Copy Link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
        </a>
    </div>

    <!-- Copy feedback -->
    <span class="copy-feedback">Link copied!</span>
</div>

<style>
.social-share-container {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
}

.share-label {
    font-weight: 500;
    color: #666;
    font-size: 14px;
}

.share-buttons {
    display: flex;
    gap: 8px;
}

.share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    transition: all 0.2s ease;
    text-decoration: none;
}

.share-facebook {
    background: #1877F2;
    color: white;
}
.share-facebook:hover {
    background: #0d5fc4;
    transform: scale(1.1);
}

.share-twitter {
    background: #000;
    color: white;
}
.share-twitter:hover {
    background: #333;
    transform: scale(1.1);
}

.share-whatsapp {
    background: #25D366;
    color: white;
}
.share-whatsapp:hover {
    background: #1da851;
    transform: scale(1.1);
}

.share-linkedin {
    background: #0A66C2;
    color: white;
}
.share-linkedin:hover {
    background: #084d93;
    transform: scale(1.1);
}

.share-copy {
    background: #6c757d;
    color: white;
}
.share-copy:hover {
    background: #545b62;
    transform: scale(1.1);
}

.copy-feedback {
    display: none;
    font-size: 12px;
    color: #28a745;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>

<script>
function getShareData() {
    const container = document.querySelector('.social-share-container');
    return {
        url: container.dataset.shareUrl || window.location.href,
        title: container.dataset.shareTitle || document.title
    };
}

function shareToFacebook(event) {
    event.preventDefault();
    const data = getShareData();
    const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(data.url)}&quote=${encodeURIComponent(data.title)}`;
    window.open(url, 'facebook-share', 'width=580,height=400');
    trackShare('facebook');
}

function shareToTwitter(event) {
    event.preventDefault();
    const data = getShareData();
    const url = `https://twitter.com/intent/tweet?url=${encodeURIComponent(data.url)}&text=${encodeURIComponent(data.title)}`;
    window.open(url, 'twitter-share', 'width=580,height=400');
    trackShare('twitter');
}

function shareToWhatsApp(event) {
    event.preventDefault();
    const data = getShareData();
    const text = `${data.title}\n${data.url}`;
    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
    trackShare('whatsapp');
}

function shareToLinkedIn(event) {
    event.preventDefault();
    const data = getShareData();
    const url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(data.url)}`;
    window.open(url, 'linkedin-share', 'width=580,height=400');
    trackShare('linkedin');
}

function copyShareLink(event) {
    event.preventDefault();
    const data = getShareData();

    navigator.clipboard.writeText(data.url).then(() => {
        const feedback = document.querySelector('.copy-feedback');
        feedback.style.display = 'inline';
        setTimeout(() => {
            feedback.style.display = 'none';
        }, 2000);
        trackShare('copy');
    }).catch(err => {
        console.error('Failed to copy:', err);
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = data.url;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
    });
}

function trackShare(platform) {
    // Extract product ID from URL if on product page
    const pathMatch = window.location.pathname.match(/\/products?\/(\d+)\//);
    if (pathMatch) {
        fetch(`/api/v1/social/track/${pathMatch[1]}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ platform: platform })
        }).catch(err => console.log('Share tracking skipped'));
    }
}
</script>
