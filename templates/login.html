{% extends 'base.html' %}

{% block title %}Login | Agri B2B{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-4">Login</h3>
                    <form method="post" action=".">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label" for="id_username">Username</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="id_password">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Login</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="small text-muted">Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none text-success">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
