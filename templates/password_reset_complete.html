{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 text-center">
                <div class="card-body p-5">
                    <div class="mb-4 text-success display-1">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h4 class="fw-bold mb-3">Password Reset Successful!</h4>
                    <p class="text-muted mb-4">
                        Your password has been successfully reset.
                        You can now log in with your new password.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-success btn-lg rounded-pill px-5">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Log In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
